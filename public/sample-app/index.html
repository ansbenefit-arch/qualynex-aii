<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Demo Education Portal</title><style>body{font-family:system-ui;background:#f2f5fa;color:#26344e;padding:50px;max-width:600px;margin:auto}section{background:white;border-radius:16px;padding:30px;box-shadow:0 4px 20px #0001}button,input{padding:11px;margin:7px 0;display:block;width:100%;border-radius:6px;border:1px solid #b7c8df}button{background:#3664e2;color:white;cursor:pointer}button:disabled{background:#c3cbd9}#error{color:#b91c1c}#success{color:#15803d}</style></head><body><section><h1 id="app-heading">Education Portal Dashboard</h1><p>This is a local demo application for real Playwright test evidence — no customer data.</p><button id="schedule">Schedule Session</button><div id="booking" hidden><label>Student name <input id="studentName" autocomplete="off"></label><label>Session date <input id="date" type="date"></label><button id="book">Book session</button><button id="cancel" type="button">Cancel</button><p id="error" hidden>Student name is required.</p><p id="success" hidden>Booking confirmed.</p></div></section><script>const blocked=new URLSearchParams(location.search).has('blocked');if(blocked)document.querySelector('#schedule').disabled=true;document.querySelector('#schedule').onclick=()=>document.querySelector('#booking').hidden=false;document.querySelector('#book').onclick=()=>{const good=Boolean(document.querySelector('#studentName').value.trim()&&document.querySelector('#date').value);document.querySelector('#error').hidden=good;document.querySelector('#success').hidden=!good;};document.querySelector('#cancel').onclick=()=>{document.querySelector('#booking').hidden=true;document.querySelector('#error').hidden=true;document.querySelector('#success').hidden=true;};</script></body></html>
